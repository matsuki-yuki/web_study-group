<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- margin -->
  <rect x="20" y="20" width="520" height="300" fill="#f6efe0" stroke="#d9b96a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="40" font-size="15" fill="#a8842f" font-weight="bold">margin（外側の余白）</text>
  <!-- border -->
  <rect x="90" y="70" width="380" height="200" fill="#ececec" stroke="#999" stroke-width="2"/>
  <text x="104" y="90" font-size="15" fill="#666" font-weight="bold">border（枠線）</text>
  <!-- padding -->
  <rect x="130" y="110" width="300" height="120" fill="#e2eef9" stroke="#7fb0e0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="144" y="130" font-size="15" fill="#2f6db5" font-weight="bold">padding（内側の余白）</text>
  <!-- content -->
  <rect x="200" y="150" width="160" height="60" rx="4" fill="#2c3542"/>
  <text x="280" y="186" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">content（中身）</text>
</svg>
