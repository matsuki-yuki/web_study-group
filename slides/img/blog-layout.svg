<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- 外枠 -->
  <rect x="20" y="20" width="520" height="360" rx="8" fill="#ffffff" stroke="#e0dacd" stroke-width="2"/>
  <!-- header -->
  <rect x="20" y="20" width="520" height="70" rx="8" fill="#2c3542"/>
  <text x="280" y="52" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">header</text>
  <text x="280" y="74" font-size="14" text-anchor="middle" fill="#c7cdd6">ヘッダー（サイト名・グローバルナビ）</text>
  <!-- breadcrumb -->
  <rect x="20" y="90" width="520" height="34" fill="#f6f4ef"/>
  <text x="40" y="112" font-size="14" fill="#888">nav .breadcrumb（パンくず）</text>
  <!-- main + aside -->
  <rect x="35" y="140" width="310" height="180" rx="6" fill="#e2eef9" stroke="#2f6db5" stroke-width="2"/>
  <text x="190" y="228" font-size="19" text-anchor="middle" fill="#2f6db5" font-weight="bold">main</text>
  <text x="190" y="252" font-size="14" text-anchor="middle" fill="#2f6db5">メインエリア（記事）</text>
  <rect x="360" y="140" width="165" height="180" rx="6" fill="#fdf1e9" stroke="#e8622c" stroke-width="2"/>
  <text x="442" y="222" font-size="18" text-anchor="middle" fill="#e8622c" font-weight="bold">aside</text>
  <text x="442" y="246" font-size="13" text-anchor="middle" fill="#e8622c">サイドバー</text>
  <!-- footer -->
  <rect x="20" y="335" width="520" height="45" rx="8" fill="#2c3542"/>
  <text x="280" y="363" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">footer（フッター）</text>
</svg>
