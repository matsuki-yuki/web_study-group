<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- ブラウザ -->
  <g>
    <rect x="30" y="60" width="180" height="130" rx="10" fill="#ffffff" stroke="#2c3542" stroke-width="2.5"/>
    <rect x="30" y="60" width="180" height="28" rx="10" fill="#2c3542"/>
    <circle cx="46" cy="74" r="4" fill="#ff6058"/>
    <circle cx="60" cy="74" r="4" fill="#ffbd2e"/>
    <circle cx="74" cy="74" r="4" fill="#28c940"/>
    <text x="120" y="135" font-size="34" text-anchor="middle">🖥️</text>
    <text x="120" y="172" font-size="17" text-anchor="middle" fill="#2c3542" font-weight="bold">ブラウザ</text>
  </g>
  <!-- 矢印 右 -->
  <g>
    <line x1="220" y1="105" x2="310" y2="105" stroke="#e8622c" stroke-width="3"/>
    <polygon points="310,99 324,105 310,111" fill="#e8622c"/>
    <text x="270" y="94" font-size="14" text-anchor="middle" fill="#e8622c">見せて！</text>
  </g>
  <!-- サーバー -->
  <g>
    <rect x="330" y="60" width="150" height="130" rx="10" fill="#ffffff" stroke="#2c3542" stroke-width="2.5"/>
    <text x="405" y="135" font-size="34" text-anchor="middle">🗄️</text>
    <text x="405" y="172" font-size="17" text-anchor="middle" fill="#2c3542" font-weight="bold">サーバー</text>
  </g>
  <!-- 矢印 左 -->
  <g>
    <line x1="590" y1="130" x2="500" y2="130" stroke="#2f6db5" stroke-width="3"/>
    <polygon points="500,124 486,130 500,136" fill="#2f6db5"/>
    <text x="545" y="120" font-size="14" text-anchor="middle" fill="#2f6db5">はいどうぞ</text>
  </g>
  <!-- ファイル -->
  <g>
    <rect x="600" y="60" width="130" height="130" rx="10" fill="#ffffff" stroke="#2c3542" stroke-width="2.5"/>
    <text x="665" y="130" font-size="32" text-anchor="middle">📄</text>
    <text x="665" y="168" font-size="15" text-anchor="middle" fill="#2c3542" font-weight="bold">HTML/CSS</text>
  </g>
  <text x="380" y="222" font-size="15" text-anchor="middle" fill="#888">今日つくるのは、この「📄 HTML/CSSファイル」の部分</text>
</svg>
