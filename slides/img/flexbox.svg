<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- before -->
  <text x="150" y="30" font-size="15" text-anchor="middle" fill="#888">display:flex 前（縦積み）</text>
  <rect x="40" y="45" width="220" height="180" rx="6" fill="#f6f4ef" stroke="#e0dacd" stroke-width="1.5"/>
  <rect x="60" y="60" width="180" height="45" rx="4" fill="#2f6db5"/>
  <text x="150" y="88" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <rect x="60" y="115" width="180" height="45" rx="4" fill="#2f6db5"/>
  <text x="150" y="143" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
  <rect x="60" y="170" width="180" height="45" rx="4" fill="#2f6db5"/>
  <text x="150" y="198" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">C</text>

  <!-- 矢印 -->
  <line x1="300" y1="135" x2="360" y2="135" stroke="#e8622c" stroke-width="3"/>
  <polygon points="360,128 376,135 360,142" fill="#e8622c"/>
  <text x="338" y="122" font-size="14" text-anchor="middle" fill="#e8622c" font-family="monospace">flex</text>

  <!-- after -->
  <text x="560" y="30" font-size="15" text-anchor="middle" fill="#888">display:flex 後（横並び）</text>
  <rect x="400" y="45" width="290" height="110" rx="6" fill="#f6f4ef" stroke="#e0dacd" stroke-width="1.5"/>
  <rect x="416" y="70" width="80" height="60" rx="4" fill="#e8622c"/>
  <text x="456" y="106" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <rect x="506" y="70" width="80" height="60" rx="4" fill="#e8622c"/>
  <text x="546" y="106" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
  <rect x="596" y="70" width="80" height="60" rx="4" fill="#e8622c"/>
  <text x="636" y="106" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">C</text>
</svg>
