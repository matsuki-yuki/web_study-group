<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- コード全体 -->
  <text x="360" y="80" font-size="40" text-anchor="middle" font-family="monospace" font-weight="bold">
    <tspan fill="#22863a">&lt;h1&gt;</tspan><tspan fill="#2b2b2b">はじめまして</tspan><tspan fill="#22863a">&lt;/h1&gt;</tspan>
  </text>
  <!-- 開始タグ -->
  <g>
    <line x1="130" y1="95" x2="130" y2="130" stroke="#e8622c" stroke-width="2"/>
    <rect x="70" y="130" width="120" height="46" rx="8" fill="#fdf1e9" stroke="#e8622c" stroke-width="1.5"/>
    <text x="130" y="152" font-size="16" text-anchor="middle" fill="#e8622c" font-weight="bold">開始タグ</text>
    <text x="130" y="169" font-size="12" text-anchor="middle" fill="#888">ここから</text>
  </g>
  <!-- 中身 -->
  <g>
    <line x1="360" y1="95" x2="360" y2="130" stroke="#2c3542" stroke-width="2"/>
    <rect x="290" y="130" width="140" height="46" rx="8" fill="#f2f0eb" stroke="#2c3542" stroke-width="1.5"/>
    <text x="360" y="152" font-size="16" text-anchor="middle" fill="#2c3542" font-weight="bold">中身</text>
    <text x="360" y="169" font-size="12" text-anchor="middle" fill="#888">表示される内容</text>
  </g>
  <!-- 終了タグ -->
  <g>
    <line x1="600" y1="95" x2="600" y2="130" stroke="#2f6db5" stroke-width="2"/>
    <rect x="535" y="130" width="130" height="46" rx="8" fill="#eef4fb" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="600" y="152" font-size="16" text-anchor="middle" fill="#2f6db5" font-weight="bold">終了タグ</text>
    <text x="600" y="169" font-size="12" text-anchor="middle" fill="#888">/ で閉じる</text>
  </g>
</svg>
